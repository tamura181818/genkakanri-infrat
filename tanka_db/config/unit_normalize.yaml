# =============================================================
# 単位表記ゆれ辞書  unit_normalize.yaml
# -------------------------------------------------------------
# 目的: 抽出した「単位」の表記ゆれを統一する（04_validate で使用）。
#       左辺(別名)に一致した単位を、右辺(正規形)へ置換する。
#       既存F単価DBの正規化知見（m2/m²/㎡→m2、全角スペース除去 等）を流用。
#
# 判定手順（04_validate 側の実装）:
#   1. 前処理: 全角英数記号→半角、全角/半角スペース除去、丸カッコ統一。
#   2. aliases の別名に完全一致すれば正規形へ置換。
#   3. どれにも一致しなければ、前処理後の文字列をそのまま採用し
#      unknown_units として review 集計に記録する（辞書育成のため）。
# =============================================================

normalize:
  strip_spaces: true            # 全半角スペース除去
  fullwidth_to_halfwidth: true  # 全角英数記号→半角

# 正規形: [別名, 別名, ...]
aliases:
  # --- 面積 ---
  m2: ["m2", "m²", "㎡", "M2", "平方メートル", "平米"]
  cm2: ["cm2", "cm²", "㎠"]
  # --- 体積 ---
  m3: ["m3", "m³", "立方メートル", "立米"]
  L: ["l", "L", "リットル", "ℓ"]
  # --- 長さ ---
  m: ["m", "ｍ", "メートル"]
  cm: ["cm", "㎝", "センチ"]
  mm: ["mm", "㎜", "ミリ"]
  km: ["km", "㎞", "キロメートル"]
  # --- 質量 ---
  t: ["t", "ｔ", "トン", "ton"]
  kg: ["kg", "㎏", "キログラム"]
  g: ["g", "ｇ", "グラム"]
  # --- 個数・回数 ---
  本: ["本"]
  枚: ["枚"]
  個: ["個", "ヶ", "箇"]
  台: ["台"]
  基: ["基"]
  組: ["組"]
  面: ["面"]
  箇所: ["箇所", "ヶ所", "カ所", "か所"]
  回: ["回"]
  # --- 時間・供用 ---
  日: ["日"]
  供用日: ["供用日"]
  時間: ["時間", "hr", "h"]
  月: ["月", "ヶ月", "カ月", "か月"]
  # --- 労務 ---
  人: ["人"]
  人日: ["人日"]
  # --- その他 ---
  式: ["式"]
  袋: ["袋"]
  m2日: ["m2日", "m²日", "㎡日"]   # 賃料等で出現しうる複合単位
