# =============================================================
# 労務職種 除外辞書  labor_exclude.yaml
# -------------------------------------------------------------
# 目的: 抽出した明細行のうち「純粋労務（職種の賃金）」だけを除外する。
#       辞書に載る職種名に該当する行を除外し、それ以外は全て保持する。
#
# 出典（根拠）:
#   ・公共工事設計労務単価（令和8年3月適用／2省協定・全国51職種）
#     国土交通省 令和8年2月17日公表。神奈川県 県土整備局
#     「令和8年度公共工事設計労務単価表（令和8年4月設定）」で職種名を確認。
#   ・上記に加え、代価表に労務として現れる関連単価表の職種
#     （電気通信／機械設備／鋼橋製作工）も収録。
#
# 運用: 拾いすぎ（本来残すべき行を除外）が起きたら該当語を辞書から外し、
#       取りこぼし（労務が残る）が起きたら語を追加する。
#       コード変更なしにこのファイルだけで調整できるようにする。
# =============================================================

# --- マッチ方針（実装ルール） -------------------------------
# 名称を正規化してから判定する。過剰除去を防ぐため、単なる部分一致では
# なく「完全一致」または「労務単位を伴う一致」を条件にする。
match_policy:
  normalize:                # 判定前の正規化
    fullwidth_to_halfwidth: true    # 全角英数記号→半角
    unify_parentheses: true         # （）と() を同一視
    strip_spaces: true              # 全半角スペース除去
    synonyms:                       # 表記ゆれの同一視
      - ["橋りょう", "橋梁"]
      - ["型わく工", "型枠工"]
      - ["さく岩工", "削岩工"]
  labor_units: ["人", "人日"]  # この単位を伴えば職種名一致で確実に除外
  rule: |
    以下のいずれかを満たす行を除外する:
      (a) 正規化後の名称が occupations のいずれかに完全一致
      (b) 正規化後の名称が occupations のいずれかを含み、かつ単位が labor_units
    上記に該当しない行は全て保持する。
  # 注意: "塗装"(施工単価 /m2) は残り、"塗装工"(/人) だけが除外される。
  #       "工場塗装工" のような工種見出し行は単価空欄の集計行として
  #       別途（号参照・集計行フィルタ）で除外されるため、ここでは扱わない。

# --- 除外対象の職種名 ---------------------------------------
occupations:

  # 設計労務単価 51職種（令和8年3月適用）
  design_labor_51:
    - 特殊作業員
    - 普通作業員
    - 軽作業員
    - 造園工
    - 法面工
    - とび工
    - 石工
    - ブロック工
    - 電工
    - 鉄筋工
    - 鉄骨工
    - 塗装工
    - 溶接工
    - 運転手(特殊)
    - 運転手(一般)
    - 潜かん工
    - 潜かん世話役
    - さく岩工
    - トンネル特殊工
    - トンネル作業員
    - トンネル世話役
    - 橋りょう特殊工
    - 橋りょう塗装工
    - 橋りょう世話役
    - 土木一般世話役
    - 高級船員
    - 普通船員
    - 潜水士
    - 潜水連絡員
    - 潜水送気員
    - 山林砂防工
    - 軌道工
    - 型わく工
    - 大工
    - 左官
    - 配管工
    - はつり工
    - 防水工
    - 板金工
    - タイル工
    - サッシ工
    - 屋根ふき工
    - 内装工
    - ガラス工
    - 建具工
    - ダクト工
    - 保温工
    - 建築ブロック工
    - 設備機械工
    - 交通誘導警備員A
    - 交通誘導警備員B

  # 電気通信関係技術者等（労務費のうち技術労力費）
  telecom:
    - 電気通信技術者
    - 電気通信技術員
    - 点検技術者
    - 点検技術員
    - 運転監視技術員

  # 機械設備労務単価
  machinery_setup:
    - 機械設備製作工
    - 機械設備据付工

  # 鋼橋積算基準における製作工労務単価（橋梁で頻出）
  steel_bridge:
    - 製作工(橋梁)

# --- グレー項目（辞書には入れない＝現方針では保持される） ----
# 下記は「職種名」ではなく費目・機械経費名のため、この辞書には載せない。
# 現方針（職種名辞書のみで除外）では保持される。除外したい場合は
# occupations に追記するか、別ルールを設けること。
gray_not_excluded:
  - 移動式クレーン運転費   # 機械運転費。職種名ではないため現方針では保持
  - 製作直接労務費         # 費目集計。通常は単価空欄の集計行として別途除外
  - 間接労務費             # 同上
